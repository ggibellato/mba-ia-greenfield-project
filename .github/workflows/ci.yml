name: CI

on:
  pull_request:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nestjs-project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env
        run: cp .env.example .env

      - name: Start infrastructure and API containers
        run: docker compose -f compose.yaml up -d --build nestjs-api db mailpit redis minio

      - name: Wait for nestjs-api container to be ready
        run: |
          for i in $(seq 1 30); do
            docker compose -f compose.yaml exec -T nestjs-api true && break
            sleep 2
          done

      - name: Install dependencies
        run: docker compose -f compose.yaml exec -T nestjs-api npm ci

      - name: Run database migrations
        run: docker compose -f compose.yaml exec -T nestjs-api npm run migration:run

      - name: Type-check
        run: docker compose -f compose.yaml exec -T nestjs-api npx tsc --noEmit

      - name: Lint
        run: docker compose -f compose.yaml exec -T nestjs-api npm run lint:check

      - name: Unit + integration tests
        run: docker compose -f compose.yaml exec -T nestjs-api npm test

      - name: E2E tests
        run: docker compose -f compose.yaml exec -T nestjs-api npm run test:e2e

      - name: Build
        run: docker compose -f compose.yaml exec -T nestjs-api npm run build

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs

      - name: Tear down containers
        if: always()
        run: docker compose -f compose.yaml down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: next-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          API_URL: http://nestjs-api:3000
          SESSION_PASSWORD: test-session-secret-that-is-at-least-32ch

      - name: Start containerized dev server
        run: |
          docker compose -f compose.yaml up -d --build
          docker compose -f compose.yaml exec -T -d next-frontend sh -c "API_URL=http://nestjs-api:3000 SESSION_PASSWORD=test-session-secret-that-is-at-least-32ch MSW_ENABLED=true npm run dev"

      - name: Wait for dev server to be ready
        run: curl --retry 20 --retry-delay 2 --retry-connrefused -I http://localhost:3001

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: next-frontend/playwright-report

      - name: Tear down containers
        if: always()
        run: docker compose -f compose.yaml down -v
